# Configuration is read from environment variables, so no secrets live in Git.
# Required (the app will not start without them):
#   DB_PASSWORD, JWT_SECRET, ADMIN_PASSWORD
# Optional (defaults shown):
#   DB_URL, DB_USERNAME
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/evoting?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: update
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
admin:
  password: ${ADMIN_PASSWORD}